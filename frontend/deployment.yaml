apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: exam-app
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # imagePullSecrets:
      #   - name: regcred
      containers:
        - name: frontend
          image: DOCKERHUB_USERNAME/frontend-my-app-frontend:TAG
          ports:
            - containerPort: 8080          # nginx (EXPOSE 80 in the Dockerfile)
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
