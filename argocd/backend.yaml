apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: exam-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/YOUR_MANIFEST_REPO.git   # <- this repo
    targetRevision: main
    path: backend
  destination:
    server: https://kubernetes.default.svc
    namespace: exam-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
